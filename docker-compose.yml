version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hackathon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hackathon_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hackathon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # server:
  #   build: ./docker/server.Dockerfile (placeholder — add once backend exists)
  #   depends_on: [postgres, redis]

  # client:
  #   build: ./docker/client.Dockerfile (placeholder — add once frontend exists)

volumes:
  postgres_data:
